name: G32 Attention and Temporal

on:
  pull_request:
    paths:
      - '.github/workflows/g32-temporal.yml'
      - 'src/server/responsibility/**'
      - 'src/server/db/repositories/responsibility.ts'
      - 'src/server/db/repositories/temporal.ts'
      - 'src/server/db/schema/**'
      - 'tests/attention-temporal.test.ts'
      - 'tests/responsibility-reducer.test.ts'
      - 'tests/temporal-production-integration.ts'
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  g32-temporal:
    name: PostgreSQL 18.6 Temporal acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: lunowa_g32_clean
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lunowa_g32_clean"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Use Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify committed database artifacts are current
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle drizzle.config.ts src/server/db/schema package.json
          test -z "$(git ls-files --others --exclude-standard -- drizzle)"

      - name: Run deterministic attention and Temporal suite
        run: pnpm exec vitest run tests/responsibility-reducer.test.ts tests/attention-temporal.test.ts

      - name: Run production Temporal durability suite
        env:
          G32_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lunowa_g32_clean
        run: pnpm test:temporal-production
