services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: lunowa_issue_14
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '55414:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lunowa_issue_14']
      interval: 2s
      timeout: 5s
      retries: 30
