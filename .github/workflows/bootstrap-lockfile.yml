name: Bootstrap Lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'feat/phase-0-bootstrap' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Generate lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore: generate Phase 0 lockfile'
          git push origin HEAD:${{ github.head_ref }}
