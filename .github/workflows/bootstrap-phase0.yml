name: Bootstrap Phase 0

on:
  push:
    branches:
      - feat/phase-0-bootstrap

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Generate official Next.js scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lunowa-app
          pnpm dlx create-next-app@16.3.0 /tmp/lunowa-app \
            --typescript \
            --eslint \
            --tailwind \
            --app \
            --src-dir \
            --import-alias '@/*' \
            --use-pnpm \
            --yes

          cp /tmp/lunowa-app/package.json ./package.json
          cp /tmp/lunowa-app/pnpm-lock.yaml ./pnpm-lock.yaml
          cp /tmp/lunowa-app/tsconfig.json ./tsconfig.json
          cp /tmp/lunowa-app/next-env.d.ts ./next-env.d.ts
          cp /tmp/lunowa-app/eslint.config.mjs ./eslint.config.mjs
          cp /tmp/lunowa-app/next.config.ts ./next.config.ts
          cp /tmp/lunowa-app/postcss.config.mjs ./postcss.config.mjs
          cp /tmp/lunowa-app/.gitignore ./.gitignore

          rm -rf src tests e2e messages
          mkdir -p src/app/'[locale]' src/components src/i18n tests e2e messages

      - name: Install accepted Phase 0 dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm add \
            next@16.3.0 \
            react@19.2.7 \
            react-dom@19.2.7 \
            next-intl@4.13.6

          pnpm add --save-dev \
            vitest@4.1.10 \
            @testing-library/react@16.3.2 \
            @testing-library/jest-dom@7.0.0 \
            jsdom@30.0.1 \
            @playwright/test@1.62.1

      - name: Write Phase 0 application and verification files
        shell: bash
        run: |
          set -euo pipefail

          cat > messages/ja.json <<'EOF'
          {
            "Bootstrap": {
              "eyebrow": "Phase 0",
              "title": "Lunowaの基盤が動作しています",
              "description": "次の実装は、検証可能な小さなProduct sliceとして進めます。",
              "status": "日本語UI・Tailwind・Next.js・テスト基盤を確認済み"
            }
          }
          EOF

          cat > messages/en.json <<'EOF'
          {
            "Bootstrap": {
              "eyebrow": "Phase 0",
              "title": "Lunowa foundation is running",
              "description": "The next implementation step will be a small, verifiable product slice.",
              "status": "Next.js, Tailwind, localization, and test foundations are connected"
            }
          }
          EOF

          cat > src/i18n/routing.ts <<'EOF'
          import {defineRouting} from 'next-intl/routing';

          export const routing = defineRouting({
            locales: ['ja', 'en'],
            defaultLocale: 'ja'
          });
          EOF

          cat > src/i18n/request.ts <<'EOF'
          import {hasLocale} from 'next-intl';
          import {getRequestConfig} from 'next-intl/server';
          import {routing} from './routing';

          export default getRequestConfig(async ({requestLocale}) => {
            const requested = await requestLocale;
            const locale = hasLocale(routing.locales, requested)
              ? requested
              : routing.defaultLocale;

            return {
              locale,
              messages: (await import(`../../messages/${locale}.json`)).default
            };
          });
          EOF

          cat > src/proxy.ts <<'EOF'
          import createMiddleware from 'next-intl/middleware';
          import {routing} from './i18n/routing';

          export default createMiddleware(routing);

          export const config = {
            matcher: '/((?!api|_next|_vercel|.*\\..*).*)'
          };
          EOF

          cat > next.config.ts <<'EOF'
          import type {NextConfig} from 'next';
          import createNextIntlPlugin from 'next-intl/plugin';

          const nextConfig: NextConfig = {};
          const withNextIntl = createNextIntlPlugin('./src/i18n/request.ts');

          export default withNextIntl(nextConfig);
          EOF

          cat > src/components/bootstrap-proof.tsx <<'EOF'
          type BootstrapProofProps = {
            eyebrow: string;
            title: string;
            description: string;
            status: string;
          };

          export function BootstrapProof({
            eyebrow,
            title,
            description,
            status
          }: BootstrapProofProps) {
            return (
              <main className="flex min-h-screen items-center justify-center bg-background px-6 py-12 text-foreground">
                <section
                  aria-labelledby="bootstrap-title"
                  className="w-full max-w-2xl rounded-3xl border border-border bg-surface p-8 shadow-sm"
                  data-testid="bootstrap-proof"
                >
                  <p className="text-sm font-semibold tracking-[0.18em] text-lunar-gold uppercase">
                    {eyebrow}
                  </p>
                  <h1
                    id="bootstrap-title"
                    className="mt-4 text-3xl font-semibold tracking-tight sm:text-4xl"
                  >
                    {title}
                  </h1>
                  <p className="mt-4 max-w-xl text-base leading-7 text-muted-foreground">
                    {description}
                  </p>
                  <div className="mt-8 rounded-2xl bg-brand-navy px-5 py-4 text-sm text-white">
                    {status}
                  </div>
                </section>
              </main>
            );
          }
          EOF

          cat > src/app/'[locale]'/layout.tsx <<'EOF'
          import type {Metadata} from 'next';
          import {hasLocale, NextIntlClientProvider} from 'next-intl';
          import {notFound} from 'next/navigation';
          import {routing} from '@/i18n/routing';
          import '../globals.css';

          export const metadata: Metadata = {
            title: 'Lunowa',
            description: 'Communication management with less monitoring work.'
          };

          type LocaleLayoutProps = {
            children: React.ReactNode;
            params: Promise<{locale: string}>;
          };

          export function generateStaticParams() {
            return routing.locales.map((locale) => ({locale}));
          }

          export default async function LocaleLayout({
            children,
            params
          }: LocaleLayoutProps) {
            const {locale} = await params;

            if (!hasLocale(routing.locales, locale)) {
              notFound();
            }

            return (
              <html lang={locale}>
                <body>
                  <NextIntlClientProvider>{children}</NextIntlClientProvider>
                </body>
              </html>
            );
          }
          EOF

          cat > src/app/'[locale]'/page.tsx <<'EOF'
          import {getTranslations} from 'next-intl/server';
          import {BootstrapProof} from '@/components/bootstrap-proof';

          export default async function BootstrapPage() {
            const t = await getTranslations('Bootstrap');

            return (
              <BootstrapProof
                eyebrow={t('eyebrow')}
                title={t('title')}
                description={t('description')}
                status={t('status')}
              />
            );
          }
          EOF

          cat > src/app/globals.css <<'EOF'
          @import "tailwindcss";

          :root {
            --background: #f7f8fb;
            --surface: #ffffff;
            --foreground: #172033;
            --muted-foreground: #687184;
            --border: #e2e6ef;
            --brand-navy: #17233f;
            --lunar-gold: #a77b24;
            --state-action: #d9605a;
            --state-deferred: #c88927;
            --state-waiting: #4e79b8;
            --state-completed: #4d9b7b;
            --focus-ring: #4e79b8;
          }

          @theme inline {
            --color-background: var(--background);
            --color-surface: var(--surface);
            --color-foreground: var(--foreground);
            --color-muted-foreground: var(--muted-foreground);
            --color-border: var(--border);
            --color-brand-navy: var(--brand-navy);
            --color-lunar-gold: var(--lunar-gold);
            --color-state-action: var(--state-action);
            --color-state-deferred: var(--state-deferred);
            --color-state-waiting: var(--state-waiting);
            --color-state-completed: var(--state-completed);
            --color-focus-ring: var(--focus-ring);
          }

          * {
            box-sizing: border-box;
          }

          html {
            background: var(--background);
          }

          body {
            margin: 0;
            min-width: 320px;
            background: var(--background);
            color: var(--foreground);
            font-family: Arial, Helvetica, sans-serif;
          }
          EOF

          cat > vitest.config.ts <<'EOF'
          import {dirname, resolve} from 'node:path';
          import {fileURLToPath} from 'node:url';
          import {defineConfig} from 'vitest/config';

          const rootDir = dirname(fileURLToPath(import.meta.url));

          export default defineConfig({
            resolve: {
              alias: {
                '@': resolve(rootDir, 'src')
              }
            },
            test: {
              environment: 'jsdom',
              setupFiles: ['./tests/setup.ts']
            }
          });
          EOF

          cat > tests/setup.ts <<'EOF'
          import '@testing-library/jest-dom/vitest';
          EOF

          cat > tests/bootstrap-proof.test.tsx <<'EOF'
          import {render, screen} from '@testing-library/react';
          import {describe, expect, it} from 'vitest';
          import {BootstrapProof} from '@/components/bootstrap-proof';

          describe('BootstrapProof', () => {
            it('renders the localized bootstrap contract', () => {
              render(
                <BootstrapProof
                  eyebrow="Phase 0"
                  title="Lunowaの基盤が動作しています"
                  description="検証可能な基盤です。"
                  status="検証済み"
                />
              );

              expect(
                screen.getByRole('heading', {name: 'Lunowaの基盤が動作しています'})
              ).toBeInTheDocument();
              expect(screen.getByText('検証済み')).toBeInTheDocument();
            });
          });
          EOF

          cat > playwright.config.ts <<'EOF'
          import {defineConfig, devices} from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            fullyParallel: false,
            workers: process.env.CI ? 1 : undefined,
            retries: process.env.CI ? 1 : 0,
            reporter: process.env.CI ? 'github' : 'list',
            use: {
              baseURL: 'http://127.0.0.1:3000',
              trace: 'retain-on-failure'
            },
            projects: [
              {
                name: 'chromium',
                use: {...devices['Desktop Chrome']}
              }
            ],
            webServer: {
              command: 'pnpm start',
              url: 'http://127.0.0.1:3000/ja',
              reuseExistingServer: !process.env.CI,
              timeout: 120_000
            }
          });
          EOF

          cat > e2e/bootstrap.spec.ts <<'EOF'
          import {expect, test} from '@playwright/test';

          test('loads the localized Phase 0 bootstrap page', async ({page}) => {
            await page.goto('/ja');

            await expect(
              page.getByRole('heading', {name: 'Lunowaの基盤が動作しています'})
            ).toBeVisible();
            await expect(page.getByTestId('bootstrap-proof')).toBeVisible();
          });
          EOF

          cat > .node-version <<'EOF'
          24
          EOF

          cat > .env.example <<'EOF'
          # Phase 0 requires no environment variables or secrets.
          EOF

          if ! grep -q '^!\.env\.example$' .gitignore; then
            printf '\n!.env.example\n' >> .gitignore
          fi

          node <<'EOF'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          pkg.name = 'lunowa';
          pkg.private = true;
          pkg.packageManager = 'pnpm@11.20.0';
          pkg.engines = {node: '>=24 <25'};
          pkg.scripts = {
            dev: 'next dev',
            build: 'next build',
            start: 'next start',
            lint: 'eslint .',
            typecheck: 'tsc --noEmit',
            test: 'vitest run',
            'test:watch': 'vitest',
            'test:e2e': 'playwright test',
            verify: 'pnpm typecheck && pnpm lint && pnpm test && pnpm build'
          };

          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          EOF

          pnpm install

      - name: Verify Phase 0 scaffold
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm verify
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Commit verified scaffold to implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json pnpm-lock.yaml tsconfig.json next-env.d.ts eslint.config.mjs \
            next.config.ts postcss.config.mjs .gitignore .node-version .env.example \
            messages src tests e2e vitest.config.ts playwright.config.ts
          git commit -m 'feat: bootstrap Lunowa Phase 0 runtime'
          git push origin HEAD:feat/phase-0-bootstrap
